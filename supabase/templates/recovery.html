<div style="font-family: Arial, Helvetica, sans-serif; max-width: 440px; margin: 0 auto; padding: 24px; color: #1f2433;">
  <h2 style="margin: 0 0 12px; font-size: 20px;">Sauda — восстановление пароля</h2>
  <p style="margin: 0 0 16px; font-size: 15px; line-height: 1.5;">Введите этот код в окне восстановления пароля:</p>
  <p style="margin: 0 0 16px; padding: 14px; background: #f2f3f8; border-radius: 10px; text-align: center; font-size: 30px; font-weight: bold; letter-spacing: 8px;">{{ .Token }}</p>
  <p style="margin: 0 0 16px; font-size: 14px; line-height: 1.5;">Или перейдите по ссылке: <a href="{{ .ConfirmationURL }}" style="color: #4a43dd;">задать новый пароль</a>.</p>
  <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #7a8094;">Код действует один час. Если вы не просили восстановить пароль, ничего делать не нужно: пароль останется прежним.</p>
</div>
