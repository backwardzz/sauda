name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # своя очередь у каждой ветки: проверка пул-реквеста не отменяет выкладку main
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Проверки чистых функций и сквозной тест серверной логики на локальной базе в Docker.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:units
      # тот же путь, что у разработчика: база в Docker, .env.local, демо-данные
      - run: npm run setup
      # типы клиента не отстали от миграций
      - run: npm run db:types -- --check
      - run: npx tsx scripts/smoke.ts
      # касса и страницы кабинета в настоящем браузере
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  build:
    needs: test
    # пул-реквесты только проверяются, на сайт уходит main
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Облачная база Supabase. Переменные репозитория (Settings → Variables) перекрывают эти значения.
    # Publishable-ключ публичный: он и так попадает в собранный сайт, доступ ограничивают правила RLS.
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://vwsjgqqtrqrayyyhavju.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_5GFbbpwjzqzXNZzRM3FRaQ_CeHA-9Xa' }}
      # Ключ сайта Cloudflare Turnstile (тоже публичный). Пока переменная не задана, сайт собирается без капчи.
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
